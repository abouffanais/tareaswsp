<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KC · Tareas por Mundo</title>
<style>
  :root{
    --charcoal:#1E1E1E;
    --cream:#F2F1EC;
    --gold:#C9A227;
    --green:#4A7C59;
    --red:#B23A3A;
    --orange:#C97B27;
    --gray:#8A8A82;
    --card:#ffffff;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Helvetica Neue', Arial, sans-serif;
    background:var(--cream);
    color:var(--charcoal);
    height:100vh;
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }
  header{
    background:var(--charcoal);
    color:var(--cream);
    padding:16px 28px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:12px;
    flex-shrink:0;
  }
  header h1{
    margin:0;
    font-size:20px;
    letter-spacing:0.5px;
    font-weight:600;
  }
  header h1 span{ color:var(--gold); }
  .summary{ display:flex; gap:18px; font-size:13px; }
  .summary b{ display:block; font-size:20px; }
  .summary .pill{ text-align:center; }

  #config{
    background:#fff8e6;
    border-bottom:1px solid #e6d9a8;
    padding:10px 28px;
    font-size:13px;
    display:none;
    flex-shrink:0;
  }
  #config input{
    padding:6px 8px; border:1px solid #ccc; border-radius:4px; width:340px; font-size:13px;
  }
  #config button{
    padding:6px 14px; background:var(--charcoal); color:#fff; border:none; border-radius:4px; cursor:pointer;
  }

  .layout{ flex:1; display:flex; min-height:0; }

  nav.sidebar{
    width:240px;
    flex-shrink:0;
    background:#ffffff;
    border-right:1px solid #e3e1d6;
    overflow-y:auto;
    padding:12px 0;
  }
  nav.sidebar .nav-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:11px 20px;
    font-size:13px;
    font-weight:600;
    color:var(--charcoal);
    cursor:pointer;
    border-left:3px solid transparent;
  }
  nav.sidebar .nav-item:hover{ background:#f7f6f0; }
  nav.sidebar .nav-item.active{
    background:#f7f0d8;
    border-left-color:var(--gold);
    color:var(--charcoal);
  }
  nav.sidebar .nav-item .count{
    background:var(--charcoal);
    color:var(--cream);
    font-size:11px;
    font-weight:700;
    padding:1px 7px;
    border-radius:20px;
  }
  nav.sidebar .nav-item.active .count{ background:var(--gold); color:var(--charcoal); }
  nav.sidebar .nav-item .count.has-atraso{ background:var(--red); color:#fff; }
  nav.sidebar .nav-section-label{
    padding:14px 20px 6px; font-size:10px; letter-spacing:0.8px; text-transform:uppercase; color:var(--gray); font-weight:700;
  }
  nav.sidebar .nav-divider{ border-top:1px solid #e8e6dd; margin:6px 0; }

  main{
    flex:1;
    overflow-y:auto;
    padding:24px 28px;
  }

  .mundo-header{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:16px;
  }
  .mundo-header h2{
    font-size:18px;
    margin:0;
    text-transform:uppercase;
    letter-spacing:0.5px;
  }
  .mundo-header .mundo-sub{ font-size:12px; color:var(--gray); }

  .cards-list{ display:flex; flex-direction:column; gap:10px; max-width:760px; }

  .tarea-card{
    border:1px solid #e8e6dd;
    border-left:4px solid var(--gray);
    border-radius:8px;
    padding:14px 16px;
    font-size:13px;
    background:#fff;
  }
  .tarea-card.prio-Urgente{ border-left-color:var(--red); }
  .tarea-card.prio-Alta{ border-left-color:var(--orange); }
  .tarea-card.prio-Media{ border-left-color:var(--gold); }
  .tarea-card.prio-Baja{ border-left-color:var(--green); }
  .tarea-card.atrasada{ background:#fdeeee; }

  .tarea-card .top-row{
    display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:8px;
  }
  .tarea-card .titulo{ font-weight:600; line-height:1.35; font-size:14px; }
  .badge{
    font-size:10px; padding:3px 9px; border-radius:20px; color:#fff; white-space:nowrap; font-weight:600;
  }
  .badge.Urgente{ background:var(--red); }
  .badge.Alta{ background:var(--orange); }
  .badge.Media{ background:var(--gold); }
  .badge.Baja{ background:var(--green); }

  .meta{ display:flex; gap:14px; align-items:center; font-size:11.5px; color:var(--gray); margin-top:8px; flex-wrap:wrap; }
  .meta .atraso-tag{ color:var(--red); font-weight:700; }
  .meta .dias-tag{
    background:#efeee6; padding:2px 8px; border-radius:20px; font-weight:600; color:var(--charcoal);
  }
  .meta .dias-tag.dias-alerta{ background:#f7dede; color:var(--red); }

  select.estado-select{
    margin-top:10px; width:180px; font-size:12px; padding:5px; border-radius:4px; border:1px solid #ddd;
  }
  .selects-row{ display:flex; gap:8px; flex-wrap:wrap; }

  .usuarios-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(240px, 1fr));
    gap:16px;
    max-width:1100px;
  }
  .usuario-card{
    background:#fff;
    border:1px solid #e8e6dd;
    border-radius:10px;
    padding:16px;
  }
  .usuario-card .usuario-top{
    display:flex; justify-content:space-between; align-items:baseline; margin-bottom:12px;
  }
  .usuario-card .usuario-nombre{ font-weight:700; font-size:14px; }
  .usuario-card .usuario-total{ font-size:11px; color:var(--gray); }
  .usuario-subgrid{
    display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; margin-bottom:10px;
  }
  .usuario-sub{
    background:#f7f6f0; border-radius:6px; padding:8px 6px; text-align:center;
  }
  .usuario-sub b{ display:block; font-size:17px; }
  .usuario-sub span{ font-size:10px; color:var(--gray); text-transform:uppercase; letter-spacing:0.3px; }
  .usuario-atraso{
    font-size:11px; font-weight:700; text-align:center; padding:4px; border-radius:6px;
  }
  .usuario-atraso.si{ background:#f7dede; color:var(--red); }
  .usuario-atraso.no{ background:#eaf2ec; color:var(--green); }

  .empty{ color:var(--gray); font-size:12px; font-style:italic; }
  footer{ text-align:center; padding:8px; font-size:11px; color:var(--gray); flex-shrink:0; background:var(--cream); }
</style>
</head>
<body>

<header>
  <h1>KC · Tareas por <span>Mundo</span></h1>
  <div class="summary">
    <div class="pill"><b id="sum-total">0</b>Total</div>
    <div class="pill"><b id="sum-pendientes">0</b>Pendientes</div>
    <div class="pill"><b id="sum-atrasadas" style="color:#ffb3b3">0</b>Atrasadas</div>
    <div class="pill"><b id="sum-completadas">0</b>Completadas</div>
  </div>
</header>

<div id="config">
  URL del Apps Script (doGet):
  <input id="apiUrlInput" placeholder="https://script.google.com/macros/s/AKfycb.../exec">
  <button onclick="guardarUrl()">Guardar</button>
</div>

<div class="layout">
  <nav class="sidebar" id="sidebar"></nav>
  <main>
    <div id="board"><p class="empty">Cargando tareas…</p></div>
  </main>
</div>

<footer>Actualiza automáticamente cada 60s · Kitchen Center</footer>

<script>
  let API_URL = localStorage.getItem('kc_tareas_api_url') || '';

  if(!API_URL){
    document.getElementById('config').style.display = 'flex';
    document.getElementById('config').style.gap = '10px';
    document.getElementById('config').style.alignItems = 'center';
  }

  function guardarUrl(){
    const val = document.getElementById('apiUrlInput').value.trim();
    if(val){
      localStorage.setItem('kc_tareas_api_url', val);
      API_URL = val;
      document.getElementById('config').style.display = 'none';
      cargarTareas();
    }
  }

  let mundoActivo = null; // null = aún no elegido, se autoselecciona el primero
  let ultimaData = [];

  function hoy(){ const d = new Date(); d.setHours(0,0,0,0); return d; }

  function estaAtrasada(t){
    if(!t.Fecha_Limite || t.Estado === 'Completada') return false;
    return new Date(t.Fecha_Limite) < hoy();
  }

  function diasTranscurridos(t){
    if(!t.Fecha_Creacion) return null;
    const creado = new Date(t.Fecha_Creacion);
    creado.setHours(0,0,0,0);
    const ms = hoy() - creado;
    return Math.max(0, Math.round(ms / 86400000));
  }

  async function cargarTareas(){
    if(!API_URL) return;
    try{
      const res = await fetch(API_URL + '?action=list');
      const data = await res.json();
      if(!data.success){ throw new Error(data.error); }
      ultimaData = data.tareas;
      render(ultimaData);
    }catch(err){
      document.getElementById('board').innerHTML =
        '<p class="empty">No se pudo cargar (revisa la URL del Apps Script). ' + err.message + '</p>';
    }
  }

  function render(tareas){
    const grupos = {};
    let pendientes=0, atrasadas=0, completadas=0;

    tareas.forEach(t=>{
      const g = t.Grupo || 'Sin grupo';
      if(!grupos[g]) grupos[g] = [];
      grupos[g].push(t);
      if(t.Estado === 'Completada') completadas++;
      else pendientes++;
      if(estaAtrasada(t)) atrasadas++;
    });

    document.getElementById('sum-total').textContent = tareas.length;
    document.getElementById('sum-pendientes').textContent = pendientes;
    document.getElementById('sum-atrasadas').textContent = atrasadas;
    document.getElementById('sum-completadas').textContent = completadas;

    const nombresGrupos = Object.keys(grupos).sort();
    if(mundoActivo === null){
      mundoActivo = nombresGrupos[0] || null;
    } else if(mundoActivo !== '__usuarios__' && !nombresGrupos.includes(mundoActivo)){
      mundoActivo = nombresGrupos[0] || null;
    }

    renderSidebar(grupos, nombresGrupos);
    renderMain(grupos, nombresGrupos);
  }

  function renderSidebar(grupos, nombres){
    const sidebar = document.getElementById('sidebar');
    const usuariosActivo = mundoActivo === '__usuarios__';

    let html = `
      <div class="nav-item ${usuariosActivo?'active':''}" onclick="seleccionarMundo('__usuarios__')">
        <span>👤 Usuarios</span>
      </div>
      <div class="nav-divider"></div>
      <div class="nav-section-label">Mundos</div>`;

    if(nombres.length === 0){
      html += '<p class="empty" style="padding:0 20px;">Sin mundos aún</p>';
    } else {
      html += nombres.map(g=>{
        const items = grupos[g];
        const activos = items.filter(t=>t.Estado !== 'Completada').length;
        const conAtraso = items.some(estaAtrasada);
        const isActive = g === mundoActivo;
        return `
          <div class="nav-item ${isActive?'active':''}" onclick="seleccionarMundo('${g.replace(/'/g,"\\'")}')">
            <span>${g}</span>
            <span class="count ${conAtraso?'has-atraso':''}">${activos}</span>
          </div>`;
      }).join('');
    }

    sidebar.innerHTML = html;
  }

  function seleccionarMundo(g){
    mundoActivo = g;
    render(ultimaData);
  }

  function renderMain(grupos, nombres){
    const board = document.getElementById('board');

    if(mundoActivo === '__usuarios__'){
      renderUsuarios(board);
      return;
    }

    if(nombres.length === 0){
      board.innerHTML = '<p class="empty">Aún no llegan tareas.</p>';
      return;
    }
    const items = (grupos[mundoActivo] || []).sort((a,b)=> (estaAtrasada(b)?1:0) - (estaAtrasada(a)?1:0));
    const activos = items.filter(t=>t.Estado !== 'Completada').length;

    board.innerHTML = `
      <div class="mundo-header">
        <h2>${mundoActivo}</h2>
        <span class="mundo-sub">${activos} activas · ${items.length} en total</span>
      </div>
      <div class="cards-list">
        ${items.length ? items.map(t => cardHtml(t, nombres)).join('') : '<p class="empty">Sin tareas en este mundo</p>'}
      </div>`;
  }

  function renderUsuarios(board){
    const porResponsable = {};
    ultimaData.forEach(t=>{
      const r = t.Responsable && t.Responsable.trim() ? t.Responsable.trim() : 'Sin responsable';
      if(!porResponsable[r]) porResponsable[r] = [];
      porResponsable[r].push(t);
    });

    const nombres = Object.keys(porResponsable).sort();

    if(nombres.length === 0){
      board.innerHTML = `
        <div class="mundo-header"><h2>Usuarios</h2></div>
        <p class="empty">Aún no hay tareas con un responsable asignado.</p>`;
      return;
    }

    const cards = nombres.map(nombre=>{
      const items = porResponsable[nombre];
      const pendientes = items.filter(t=>t.Estado === 'Pendiente').length;
      const enCurso = items.filter(t=>t.Estado === 'En curso').length;
      const completadas = items.filter(t=>t.Estado === 'Completada').length;
      const atrasadas = items.filter(estaAtrasada).length;
      return `
        <div class="usuario-card">
          <div class="usuario-top">
            <span class="usuario-nombre">${nombre}</span>
            <span class="usuario-total">${items.length} tarea${items.length===1?'':'s'}</span>
          </div>
          <div class="usuario-subgrid">
            <div class="usuario-sub"><b>${pendientes}</b><span>Pendiente</span></div>
            <div class="usuario-sub"><b>${enCurso}</b><span>En curso</span></div>
            <div class="usuario-sub"><b>${completadas}</b><span>Completada</span></div>
          </div>
          <div class="usuario-atraso ${atrasadas>0?'si':'no'}">
            ${atrasadas>0 ? `⚠️ ${atrasadas} atrasada${atrasadas===1?'':'s'}` : '✓ Sin atrasos'}
          </div>
        </div>`;
    }).join('');

    board.innerHTML = `
      <div class="mundo-header">
        <h2>Usuarios</h2>
        <span class="mundo-sub">${nombres.length} responsable${nombres.length===1?'':'s'}</span>
      </div>
      <div class="usuarios-grid">${cards}</div>`;
  }

  function cardHtml(t, nombresGrupos){
    const atrasada = estaAtrasada(t);
    const fecha = t.Fecha_Limite ? new Date(t.Fecha_Limite).toLocaleDateString('es-CL') : '';
    const dias = diasTranscurridos(t);
    const diasAlerta = dias !== null && dias >= 5 && t.Estado !== 'Completada'; // umbral provisorio, se afina con categorías de alerta
    const opcionesGrupo = nombresGrupos.map(g =>
      `<option value="${g}" ${g===t.Grupo?'selected':''}>${g}</option>`
    ).join('');
    const responsablesConocidos = [...new Set(ultimaData.map(x => (x.Responsable||'').trim()).filter(Boolean))].sort();
    const opcionesResponsable = responsablesConocidos.map(r =>
      `<option value="${r}" ${r===(t.Responsable||'').trim()?'selected':''}>${r}</option>`
    ).join('');
    return `
      <div class="tarea-card prio-${t.Prioridad}${atrasada ? ' atrasada' : ''}">
        <div class="top-row">
          <div class="titulo">${t.Tarea}</div>
          <span class="badge ${t.Prioridad}">${t.Prioridad}</span>
        </div>
        <div class="meta">
          ${dias !== null ? `<span class="dias-tag${diasAlerta?' dias-alerta':''}">${dias === 0 ? 'Creada hoy' : dias + ' día' + (dias===1?'':'s') + ' desde creación'}</span>` : ''}
          <span>${fecha ? '📅 vence ' + fecha : 'sin fecha límite'}</span>
          <span class="${atrasada ? 'atraso-tag' : ''}">${atrasada ? 'ATRASADA' : t.Estado}</span>
        </div>
        <div class="selects-row">
          <select class="estado-select" onchange="actualizarEstado('${t.ID}', this.value)">
            <option value="Pendiente" ${t.Estado==='Pendiente'?'selected':''}>Pendiente</option>
            <option value="En curso" ${t.Estado==='En curso'?'selected':''}>En curso</option>
            <option value="Completada" ${t.Estado==='Completada'?'selected':''}>Completada</option>
          </select>
          <select class="estado-select" onchange="cambiarGrupoSelect('${t.ID}', this)">
            ${opcionesGrupo}
            <option value="__nuevo__">+ Nuevo mundo…</option>
          </select>
          <select class="estado-select" onchange="cambiarResponsableSelect('${t.ID}', this)">
            <option value="" ${!((t.Responsable||'').trim())?'selected':''}>Sin responsable</option>
            ${opcionesResponsable}
            <option value="__nuevo__">+ Nuevo responsable…</option>
          </select>
        </div>
      </div>`;
  }

  function cambiarResponsableSelect(id, selectEl){
    const valor = selectEl.value;
    if(valor === '__nuevo__'){
      const nuevo = prompt('Nombre del responsable:');
      if(!nuevo || !nuevo.trim()){
        render(ultimaData);
        return;
      }
      actualizarResponsable(id, nuevo.trim());
    } else {
      actualizarResponsable(id, valor);
    }
  }

  async function actualizarResponsable(id, responsable){
    await fetch(`${API_URL}?action=update&id=${id}&responsable=${encodeURIComponent(responsable)}`);
    cargarTareas();
  }

  function cambiarGrupoSelect(id, selectEl){
    const valor = selectEl.value;
    if(valor === '__nuevo__'){
      const nuevo = prompt('Nombre del nuevo mundo:');
      if(!nuevo || !nuevo.trim()){
        selectEl.value = ''; // se recalcula al re-renderizar
        render(ultimaData);
        return;
      }
      actualizarGrupo(id, nuevo.trim());
    } else {
      actualizarGrupo(id, valor);
    }
  }

  async function actualizarGrupo(id, grupo){
    await fetch(`${API_URL}?action=update&id=${id}&grupo=${encodeURIComponent(grupo)}`);
    mundoActivo = grupo; // saltar a ver el mundo destino
    cargarTareas();
  }

  async function actualizarEstado(id, estado){
    await fetch(`${API_URL}?action=update&id=${id}&estado=${encodeURIComponent(estado)}`);
    cargarTareas();
  }

  cargarTareas();
  setInterval(cargarTareas, 60000);
</script>

</body>
</html>
